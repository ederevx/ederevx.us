# Catch-all: bare-IP / unrecognized Host header -> redirect to https
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Bare-IP / unrecognized Host header over TLS -> same site, gated by Basic Auth
# (mirrors the old Apache default-ssl.conf vhost)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/self-signed.pem;
    ssl_certificate_key /etc/nginx/ssl/self-signed-key.pem;

    root /usr/share/nginx/html;
    index index.php;

    auth_basic "Restricted Content";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ^~ so this wins outright over the .php regex location below (phpMyAdmin
    # serves its own .php paths internally via the upstream container)
    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ederevx.us / www.ederevx.us over TLS (Cloudflare origin cert)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ederevx.us www.ederevx.us;

    ssl_certificate         /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key     /etc/nginx/ssl/cloudflare-origin-key.pem;
    ssl_trusted_certificate /etc/nginx/ssl/cloudflare-origin-ca.pem;

    root /usr/share/nginx/html;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
